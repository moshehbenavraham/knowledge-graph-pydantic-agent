[project]
name = "luminari-ai-agent"
version = "0.7.1"
description = "Production-ready AI agent with RAG, memory, and multi-tool capabilities"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai[anthropic]>=0.1.2",
    "pydantic>=2.5.0",
    "streamlit>=1.44.0",
    "python-dotenv>=1.0.0",
    "openai>=1.75.0",
    "anthropic>=0.49.0",
    "ollama>=0.1.0",
    "mem0ai>=0.0.10",
    "supabase>=2.3.0",
    "vecs>=0.4.0",
    "brave-search-python-client>=0.1.0",
    "pypdf>=3.17.0",
    "google-api-python-client>=2.100.0",
    "structlog>=24.0.0",
    "prometheus-client>=0.19.0",
    "psutil>=5.9.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "click>=8.1.0",
    "httpx>=0.28.0",
    "asyncpg>=0.28.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "aiofiles>=23.0.0",
    "RestrictedPython>=6.0",
    "pillow>=11.2.0",
    "pgvector>=0.3.0",
    "altair>=5.5.0",
    "mcp>=1.6.0",
    "anyio>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.8.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "commitizen>=3.13.0",
    "docformatter>=1.7.5",
]
rag = [
    "watchdog>=3.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "unstructured>=0.11.0",
    "graphiti-core>=0.1.0",
    "neo4j>=5.28.0",
    "tiktoken>=0.7.0",
    "sentence-transformers>=3.3.1",
]
security = [
    "bandit>=1.7.5",
    "safety>=2.3.0",
    "pip-audit>=2.6.0",
]

[project.scripts]
luminari-agent = "src.__main__:main"
luminari-rag = "src.rag_pipeline.pipeline:main"
luminari-ui = "src.ui.streamlit_app:main"

[tool.ruff]
line-length = 100
target-version = "py311"
fix = true
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # `zip()` without an explicit `strict=` parameter
]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--verbose",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=75",
    "--asyncio-mode=auto",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.docformatter]
wrap-summaries = 88
wrap-descriptions = 88

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.7.1"
tag_format = "$version"
version_files = [
    "pyproject.toml:version"
]
