[project]
name = "luminari-ai-agent"
version = "0.1.0"
description = "Production-ready AI agent with RAG, memory, and multi-tool capabilities"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai[anthropic]>=0.1.2",
    "pydantic>=2.5.0",
    "streamlit>=1.29.0",
    "python-dotenv>=1.0.0",
    "openai>=1.10.0",
    "anthropic>=0.39.0",
    "ollama>=0.1.0",
    "mem0ai>=0.0.10",
    "supabase>=2.3.0",
    "vecs>=0.4.0",
    "brave-search-python-client>=0.1.0",
    "pypdf>=3.17.0",
    "google-api-python-client>=2.100.0",
    "structlog>=24.0.0",
    "prometheus-client>=0.19.0",
    "psutil>=5.9.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "click>=8.1.0",
    "httpx>=0.24.0",
    "asyncpg>=0.28.0",
    "numpy>=1.24.0",
    "aiofiles>=23.0.0",
    "RestrictedPython>=6.0",
    "pillow>=10.0.0",
    "pgvector>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.8.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "commitizen>=3.13.0",
    "docformatter>=1.7.5",
]
rag = [
    "watchdog>=3.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "unstructured>=0.11.0",
]
security = [
    "bandit>=1.7.5",
    "safety>=2.3.0",
    "pip-audit>=2.6.0",
]

[project.scripts]
luminari-agent = "src.__main__:main"
luminari-rag = "src.rag_pipeline.pipeline:main"
luminari-ui = "src.ui.streamlit_app:main"

[tool.ruff]
line-length = 100
target-version = "py311"
fix = true

[tool.black]
line-length = 100
target-version = ['py311', 'py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--verbose",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-fail-under=75",
    "--asyncio-mode=auto",
]

[tool.mypy]
ignore_missing_imports = true

[tool.docformatter]
wrap-summaries = 88
wrap-descriptions = 88

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "$version"
version_files = [
    "pyproject.toml:version"
]
