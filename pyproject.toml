[project]
name = "luminari-ai-agent"
version = "1.2.17"
description = "Unified Super AI Agent with intelligent routing, comprehensive tooling, configurable UI, interactive GraphRAG analytics dashboard with draggable knowledge graph, persistent analytics system, and enterprise monitoring"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=0.1.2",
    "pydantic>=2.5.0",
    "streamlit>=1.44.0",
    "python-dotenv>=1.0.0",
    "openai>=1.75.0",
    "anthropic>=0.49.0",
    "ollama>=0.1.0",
    "mem0ai>=0.0.10",
    "supabase>=2.3.0",
    "vecs>=0.4.0",
    "brave-search-python-client>=0.1.0",
    "pypdf>=3.17.0",
    "google-api-python-client>=2.100.0",
    "structlog>=24.0.0",
    "prometheus-client>=0.19.0",
    "psutil>=5.9.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "click>=8.1.0",
    "httpx>=0.28.0",
    "asyncpg>=0.28.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "aiofiles>=23.0.0",
    "RestrictedPython>=6.0",
    "pillow>=11.2.0",
    "pgvector>=0.3.0",
    "altair>=5.5.0",
    "plotly>=5.18.0",
    "networkx>=3.2.1",
    "pyvis>=0.3.2",
    "mcp>=1.6.0",
    "anyio>=4.9.0",
    "nest-asyncio>=1.5.0",
    "redis[hiredis]>=5.0.0",
    "redis-om>=0.3.0",
    "alembic>=1.13.0",
    "opentelemetry-distro>=0.48b0",
    "opentelemetry-exporter-jaeger>=1.21.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.21.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
    "opentelemetry-instrumentation-requests>=0.48b0",
    "GitPython>=3.1.45",
    "pathspec>=0.11.0",
    "coverage>=7.0.0",
    "wrapt>=1.14.0",  # Python 3.11+ compatibility fix
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "black>=24.0.0",
    "ruff>=0.8.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "commitizen>=3.13.0",
    "docformatter>=1.7.5",
    "locust>=2.20.0",
    "py-spy>=0.3.14",
    "memory-profiler>=0.61.0",
    "httpie>=3.2.2",  # Note: PYSEC-2023-242 SSL cert validation in update check - no fix available, dev-only tool, accepted risk
    "pytest-benchmark>=4.0.0",
    "pytest-timeout>=2.2.0",
    "hypothesis>=6.100.0",
    "tox>=4.11.0",
    "vulture>=2.10",
    "radon>=6.0.1",
    "interrogate>=1.5.0",  # Note: pulls in py==1.11.0 with CVE-2022-42969 (disputed, SVN-only, accepted risk)
]
rag = [
    "watchdog>=3.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "unstructured>=0.11.0",
    "graphiti-core>=0.1.0",
    "neo4j>=5.28.0",
    "tiktoken>=0.7.0",
    "sentence-transformers>=3.3.1",
    "rapidfuzz>=3.0.0",
]
auth = [
    "streamlit-authenticator>=0.3.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.0",
    "extra-streamlit-components>=0.1.60",
    "pyotp>=2.0.0",
    "qrcode>=7.4.0",
    "authlib>=1.6.5",
    "cryptography>=46.0.2",
]
security = [
    "bandit>=1.7.5",
    "safety>=2.3.0",
    "pip-audit>=2.6.0",
]
docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-autodoc-typehints>=2.0.0",
    "sphinxcontrib-mermaid>=0.9.0",
    "sphinx-autobuild>=2021.3.14",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-mermaid2-plugin>=1.1.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "mkdocs-minify-plugin>=0.7.0",
]

[project.scripts]
luminari-agent = "src.__main__:main"
luminari-rag = "src.rag_pipeline.pipeline:main"
luminari-ui = "src.ui.streamlit_app:main"
constitution-validate = "src.constitution_validator.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
fix = true
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # `zip()` without an explicit `strict=` parameter
]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--verbose",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=75",
    "--asyncio-mode=auto",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.mypy]
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
# MyPy strict mode enabled (Phase 15 complete)
# All 126 source files pass strict type checking

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.docformatter]
wrap-summaries = 88
wrap-descriptions = 88

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.8.0"
tag_format = "$version"
version_files = [
    "pyproject.toml:version"
]
