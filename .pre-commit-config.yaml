repos:
-   repo: local
    hooks:
    -   id: check-problematic-chars
        name: Check for problematic characters
        entry: python3 -c "import sys; content = open(sys.argv[1], 'rb').read(); bad = [i for i, b in enumerate(content) if b == 0 or (b < 0x20 and b not in (0x09, 0x0A, 0x0D))]; sys.exit(f'Found {len(bad)} problematic characters' if bad else 0)"
        language: system
        files: '\.(md|txt|rst|py|yaml|yml|json)$'
        pass_filenames: true
    -   id: validate-docs
        name: Validate documentation links
        entry: python3 scripts/validate_docs.py
        language: system
        files: '\.md$'
        pass_filenames: false
        stages: [pre-commit, manual]
    -   id: interrogate
        name: Check docstring coverage
        entry: bash -c "source .venv/bin/activate && interrogate"
        language: system
        types: [python]
        args: ['--fail-under', '75', '--ignore-init-method', '--ignore-init-module', '--quiet']
        pass_filenames: true
        stages: [pre-commit]
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
        exclude: ^(mkdocs\.yml|\.github/workflows/performance\.yml)$  # Exclude files with Python-specific YAML tags or embedded code
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: check-added-large-files
    -   id: check-merge-conflict
    -   id: check-json
    -   id: check-toml
    -   id: fix-byte-order-marker
    -   id: mixed-line-ending
        args: ['--fix=lf']
-   repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
    -   id: black
        args: [--line-length=100]
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.12.10'
    hooks:
    -   id: ruff
        args: [--fix, --exit-non-zero-on-fix]
-   repo: local
    hooks:
    -   id: mypy
        name: mypy
        entry: bash -c 'source .venv/bin/activate && mypy --strict --no-error-summary "$@"' --
        language: system
        types: [python]
        files: ^(src|tests)/
        pass_filenames: true
-   repo: https://github.com/PyCQA/bandit
    rev: '1.8.6'
    hooks:
    -   id: bandit
        args: ['-s', 'B101,B603']
        exclude: ^(tests/|scripts/)
-   repo: https://github.com/pypa/pip-audit
    rev: v2.9.0
    hooks:
    -   id: pip-audit
        args: ['--ignore-vuln', 'GHSA-4xh5-x5gv-qwph']  # Ignore pip vulnerability (no fix available)
