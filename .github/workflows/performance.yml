name: Performance Tests

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of performance test to run'
        required: true
        default: 'load'
        type: choice
        options:
          - load
          - stress
          - spike
          - endurance
      duration:
        description: 'Test duration (e.g., 5m, 1h)'
        required: false
        default: '5m'
      users:
        description: 'Number of concurrent users'
        required: false
        default: '50'

jobs:
  performance-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install locust

      - name: Set up environment
        run: |
          cp .env.example .env
          echo "REDIS_URL=redis://localhost:6379/0" >> .env
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db" >> .env
          echo "SUPABASE_URL=http://localhost:5432" >> .env
          echo "SUPABASE_SERVICE_KEY=test_key" >> .env

      - name: Start API server
        run: |
          python -m src.api.main &
          echo $! > api_server.pid
          sleep 10  # Wait for server to start

      - name: Check API health
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8058/health; then
              echo "API is healthy"
              break
            fi
            echo "Waiting for API to be ready... (attempt $i/30)"
            sleep 2
          done

      - name: Run performance tests
        env:
          TEST_TYPE: ${{ github.event.inputs.test_type || 'load' }}
          TEST_DURATION: ${{ github.event.inputs.duration || '5m' }}
          TEST_USERS: ${{ github.event.inputs.users || '50' }}
        run: |
          case "$TEST_TYPE" in
            load)
              locust -f tests/load/locustfile.py \
                --headless \
                --users $TEST_USERS \
                --spawn-rate 5 \
                --run-time $TEST_DURATION \
                --host=http://localhost:8058 \
                --html=performance-report.html \
                --csv=performance-metrics
              ;;
            stress)
              locust -f tests/load/scenarios.py \
                --headless \
                --users $(($TEST_USERS * 2)) \
                --spawn-rate 10 \
                --run-time $TEST_DURATION \
                --host=http://localhost:8058 \
                --html=stress-report.html \
                --csv=stress-metrics \
                --class-picker \
                -c StressTestUser
              ;;
            spike)
              locust -f tests/load/scenarios.py \
                --headless \
                --users $TEST_USERS \
                --spawn-rate 20 \
                --run-time $TEST_DURATION \
                --host=http://localhost:8058 \
                --html=spike-report.html \
                --csv=spike-metrics \
                --class-picker \
                -c SpikeTestUser
              ;;
            endurance)
              locust -f tests/load/scenarios.py \
                --headless \
                --users $(($TEST_USERS / 2)) \
                --spawn-rate 2 \
                --run-time 30m \
                --host=http://localhost:8058 \
                --html=endurance-report.html \
                --csv=endurance-metrics \
                --class-picker \
                -c EnduranceTestUser
              ;;
          esac

      - name: Generate performance summary
        if: always()
        run: |
          if [ -f performance-metrics_stats.csv ] || [ -f stress-metrics_stats.csv ] || [ -f spike-metrics_stats.csv ] || [ -f endurance-metrics_stats.csv ]; then
            echo "## Performance Test Results" > performance-summary.md
            echo "" >> performance-summary.md
            echo "Test Type: ${TEST_TYPE:-load}" >> performance-summary.md
            echo "Duration: ${TEST_DURATION:-5m}" >> performance-summary.md
            echo "Users: ${TEST_USERS:-50}" >> performance-summary.md
            echo "" >> performance-summary.md
            
            for csv_file in *_stats.csv; do
              if [ -f "$csv_file" ]; then
                echo "### Results from $csv_file" >> performance-summary.md
                echo '```' >> performance-summary.md
                cat "$csv_file" | head -20 >> performance-summary.md
                echo '```' >> performance-summary.md
                echo "" >> performance-summary.md
              fi
            done
            
            cat performance-summary.md
          fi

      - name: Check performance thresholds
        run: |
          # Parse CSV and check if P95 response time is below 500ms
          if [ -f performance-metrics_stats.csv ] || [ -f stress-metrics_stats.csv ]; then
            python -c "
import csv
import sys

threshold_p95 = 500  # milliseconds
threshold_failure_rate = 0.01  # 1%

csv_files = ['performance-metrics_stats.csv', 'stress-metrics_stats.csv', 
             'spike-metrics_stats.csv', 'endurance-metrics_stats.csv']

for csv_file in csv_files:
    try:
        with open(csv_file, 'r') as f:
            reader = csv.DictReader(f)
            for row in reader:
                if row.get('Type') == 'Request' and row.get('Name') == 'Aggregated':
                    p95 = float(row.get('95%', 0))
                    failures = float(row.get('Failure Count', 0))
                    requests = float(row.get('Request Count', 1))
                    failure_rate = failures / requests if requests > 0 else 0
                    
                    print(f'P95 Response Time: {p95}ms')
                    print(f'Failure Rate: {failure_rate:.2%}')
                    
                    if p95 > threshold_p95:
                        print(f'WARNING: P95 response time ({p95}ms) exceeds threshold ({threshold_p95}ms)')
                        sys.exit(1)
                    if failure_rate > threshold_failure_rate:
                        print(f'WARNING: Failure rate ({failure_rate:.2%}) exceeds threshold ({threshold_failure_rate:.2%})')
                        sys.exit(1)
                    
                    print('Performance thresholds passed!')
    except FileNotFoundError:
        continue
            "
          fi

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report-${{ github.event.inputs.test_type || 'load' }}-${{ github.run_number }}
          path: |
            *-report.html
            *-metrics*.csv
            performance-summary.md

      - name: Stop API server
        if: always()
        run: |
          if [ -f api_server.pid ]; then
            kill $(cat api_server.pid) || true
            rm api_server.pid
          fi

      - name: Post results to PR (if applicable)
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '';
            
            try {
              summary = fs.readFileSync('performance-summary.md', 'utf8');
            } catch (e) {
              summary = '## Performance Test Results\nNo results available.';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

  benchmark-comparison:
    runs-on: ubuntu-latest
    needs: performance-test
    if: github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download current results
        uses: actions/download-artifact@v4
        with:
          pattern: performance-report-*

      - name: Compare with baseline
