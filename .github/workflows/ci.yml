
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .[dev]

    - name: Linting
      run: |
        ruff check src/ tests/
        black --check src/ tests/

    - name: Type checking
      run: mypy src/ tests/

    - name: Testing
      run: pytest tests/

    - name: Security Scan
      run: |
        bandit -r src/
        pip-audit
