# MkDocs configuration for Agentic RAG System
site_name: Agentic RAG Documentation
site_description: Production-ready AI agent with RAG, memory, and enterprise monitoring
site_author: Luminari AI Team
site_url: https://agentic-rag.luminari.ai
repo_url: https://github.com/luminari-ai/agentic-rag
repo_name: luminari-ai/agentic-rag
edit_uri: edit/main/docs/

# Theme configuration
theme:
  name: material
  custom_dir: docs/overrides
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - header.autohide
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/robot
    repo: fontawesome/brands/github

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
      lang:
        - en
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - tags:
      tags_file: tags.md
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
            show_if_no_docstring: true
            docstring_style: google
            merge_init_into_class: true
            separate_signature: true
  - mermaid2:
      arguments:
        theme: 'base'
        themeVariables:
          primaryColor: '#6366f1'
          primaryTextColor: '#fff'
          primaryBorderColor: '#4f46e5'
          lineColor: '#5c5f77'
          secondaryColor: '#818cf8'
          tertiaryColor: '#c7d2fe'

# Markdown extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation structure
nav:
  - Home: index.md
  - Getting Started:
    - Installation: INSTALL.md
    - Configuration: CONFIGURATION.md
    - Quick Start: quickstart.md
    - Examples: EXAMPLES.md
  - User Guide:
    - Usage: USAGE.md
    - Chat Interface: guides/chat.md
    - Search Strategies: guides/search.md
    - Tool Usage: TOOL_USAGE_PATTERNS.md
    - API Reference: guides/api.md
  - Architecture:
    - Overview: ARCHITECTURE.md
    - Agent System: architecture/agent.md
    - Storage Layer: architecture/storage.md
    - Search Pipeline: architecture/search.md
    - Ingestion: architecture/ingestion.md
  - Development:
    - Setup: development/setup.md
    - Testing: 8-development/testing-guide.md
    - Performance: PERFORMANCE.md
    - Contributing: contributing.md
  - Deployment:
    - Docker: DEPLOYMENT.md
    - Monitoring: deployment/monitoring.md
    - Scaling: deployment/scaling.md
    - Troubleshooting: TROUBLESHOOTING.md
  - Advanced:
    - Database & RAG: DB_AND_RAG.md
    - Agentic RAG: AGENTIC_RAG.md
    - Dev Tools: DEV_TOOLING.md
  - Resources:
    - Changelog: CHANGELOG.md
    - FAQ: faq.md
    - Glossary: glossary.md
    - Tags: tags.md

# Extra configuration
extra:
  version:
    provider: mike
    default: stable
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/luminari-ai
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/luminari/agentic-rag
    - icon: fontawesome/brands/discord
      link: https://discord.gg/luminari
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  consent:
    title: Cookie consent
    description: We use cookies to recognize your repeated visits and preferences
  generator: false

# Copyright
copyright: Copyright &copy; 2024 Luminari AI - All Rights Reserved

# Extra CSS and JavaScript
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10.6.0/dist/mermaid.min.js
