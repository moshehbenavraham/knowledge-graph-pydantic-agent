version: '3.8'

# Development Environment Configuration
# Fast iteration, hot-reload enabled, debug logging

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    image: base-agent:dev
    container_name: base-agent-dev
    ports:
      - "8502:8502"
      - "8058:8058"  # API port
    environment:
      # ===== ENVIRONMENT =====
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG

      # ===== SUPABASE =====
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - DATABASE_URL=${SUPABASE_URL}

      # ===== LLM CONFIGURATION =====
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_CHOICE=${LLM_CHOICE:-gpt-4o-mini}

      # ===== EMBEDDING CONFIGURATION =====
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-${LLM_API_KEY}}
      - EMBEDDING_MODEL_CHOICE=${EMBEDDING_MODEL_CHOICE:-text-embedding-3-small}

      # ===== WEB SEARCH =====
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - SEARXNG_BASE_URL=http://searxng:8080

      # ===== AGENT SETTINGS =====
      - AGENT_NAME=${AGENT_NAME:-Luminari-Dev}
      - AGENT_TEMPERATURE=${AGENT_TEMPERATURE:-0.7}

      # ===== NEO4J CONFIGURATION =====
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-dev_password}

      # ===== FEATURE FLAGS =====
      - ENABLE_CODE_EXECUTION=${ENABLE_CODE_EXECUTION:-true}
      - ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH:-true}
      - ENABLE_IMAGE_ANALYSIS=${ENABLE_IMAGE_ANALYSIS:-true}
      - ENABLE_LONG_TERM_MEMORY=${ENABLE_LONG_TERM_MEMORY:-true}
      - ENABLE_RAG=${ENABLE_RAG:-true}
      - ENABLE_AGENTIC_RAG=${ENABLE_AGENTIC_RAG:-true}
      - ENABLE_GRAPH_SEARCH=${ENABLE_GRAPH_SEARCH:-true}

      # ===== LOGGING =====
      - LOG_FORMAT=pretty
      - ENABLE_STRUCTURED_LOGGING=false

      # ===== MONITORING =====
      - ENABLE_METRICS=true
      - METRICS_PORT=8002

      # ===== DEVELOPMENT =====
      - STREAMLIT_SERVER_RUN_ON_SAVE=true
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=poll

    volumes:
      # Mount source code for hot-reload
      - ../src:/app/src:rw
      - ../config:/app/config:rw
      - dev_data:/app/data
      - dev_logs:/app/logs

    depends_on:
      searxng:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8502/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - dev-network

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.production
      target: api
    image: base-agent-api:dev
    container_name: base-agent-api-dev
    ports:
      - "8059:8058"  # Separate port for API in dev
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-dev_password}
    volumes:
      - ../src:/app/src:rw
      - dev_api_logs:/app/logs
    depends_on:
      - neo4j
    restart: unless-stopped
    networks:
      - dev-network

  searxng:
    image: searxng/searxng:latest
    container_name: searxng-dev
    ports:
      - "8084:8080"
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-dev_secret_key}
      - SEARXNG_HOSTNAME=searxng
      - SEARXNG_BASE_URL=http://searxng:8080/
    volumes:
      - searxng_dev_data:/etc/searxng
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - dev-network

  neo4j:
    image: neo4j:5-community
    container_name: neo4j-dev
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-dev_password}
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms.memory.heap.initial_size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_dev_data:/data
      - neo4j_dev_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - dev-network

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - "6381:6379"
    volumes:
      - redis_dev_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dev-network

volumes:
  dev_data:
  dev_logs:
  dev_api_logs:
  searxng_dev_data:
  neo4j_dev_data:
  neo4j_dev_logs:
  redis_dev_data:

networks:
  dev-network:
    name: base-agent-dev-network
    driver: bridge
