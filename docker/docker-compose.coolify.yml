  #     - NEO4J_PASSWORD=${NEO4J_PASSWORD}
  #     - LLM_PROVIDER=${LLM_PROVIDER}
  #     - LLM_API_KEY=${LLM_API_KEY}
  #     - LOG_LEVEL=${LOG_LEVEL:-INFO}
  #     - API_HOST=0.0.0.0
  #     - API_PORT=8058
