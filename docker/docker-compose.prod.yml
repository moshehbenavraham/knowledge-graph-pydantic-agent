version: '3.8'

# Production Environment Configuration
# Hardened deployment with full observability and security controls

services:
  app:
    image: ${REGISTRY}/base-agent:${IMAGE_TAG}
    container_name: base-agent-prod
    ports:
      - "8502:8502"
    environment:
      # ===== ENVIRONMENT =====
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO

      # ===== SUPABASE =====
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - DATABASE_URL=${SUPABASE_URL}

      # ===== LLM CONFIGURATION =====
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_CHOICE=${LLM_CHOICE}

      # ===== EMBEDDING CONFIGURATION =====
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_MODEL_CHOICE=${EMBEDDING_MODEL_CHOICE}

      # ===== WEB SEARCH =====
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - SEARXNG_BASE_URL=http://searxng:8080

      # ===== AGENT SETTINGS =====
      - AGENT_NAME=${AGENT_NAME:-Luminari}
      - AGENT_TEMPERATURE=${AGENT_TEMPERATURE:-0.7}

      # ===== NEO4J CONFIGURATION =====
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}

      # ===== FEATURE FLAGS =====
      - ENABLE_CODE_EXECUTION=false  # Disabled in production
      - ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH:-true}
      - ENABLE_IMAGE_ANALYSIS=${ENABLE_IMAGE_ANALYSIS:-true}
      - ENABLE_LONG_TERM_MEMORY=${ENABLE_LONG_TERM_MEMORY:-true}
      - ENABLE_RAG=${ENABLE_RAG:-true}
      - ENABLE_AGENTIC_RAG=${ENABLE_AGENTIC_RAG:-true}
      - ENABLE_GRAPH_SEARCH=${ENABLE_GRAPH_SEARCH:-true}

      # ===== LOGGING =====
      - LOG_FORMAT=json
      - ENABLE_STRUCTURED_LOGGING=true

      # ===== MONITORING =====
      - ENABLE_METRICS=true
      - METRICS_PORT=8002
      - HEALTH_CHECK_INTERVAL=30

      # ===== PERFORMANCE =====
      - MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-50}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-300}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-100}

      # ===== SECURITY =====
      - ENABLE_RATE_LIMITING=true
      - ENABLE_REQUEST_VALIDATION=true

    volumes:
      - prod_data:/app/data:ro
      - prod_logs:/app/logs

    depends_on:
      searxng:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      prometheus:
        condition: service_started

    restart: always

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8502/_stcore/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

    networks:
      - prod-network
      - monitoring-network

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "20"
        labels: "service=app,environment=production"

    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  api:
    image: ${REGISTRY}/base-agent-api:${IMAGE_TAG}
    container_name: base-agent-api-prod
    ports:
      - "8058:8058"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_API_KEY=${LLM_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - ENABLE_METRICS=true
      - LOG_FORMAT=json
      - ENABLE_RATE_LIMITING=true
      - MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-100}
    volumes:
      - prod_api_logs:/app/logs
    depends_on:
      - neo4j
      - redis
      - prometheus
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8058/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - prod-network
      - monitoring-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "15"
        labels: "service=api,environment=production"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
      replicas: 2
    security_opt:
      - no-new-privileges:true

  searxng:
    image: searxng/searxng:latest
    container_name: searxng-prod
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_HOSTNAME=searxng
      - SEARXNG_BASE_URL=http://searxng:8080/
    volumes:
      - searxng_prod_data:/etc/searxng
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - prod-network
    security_opt:
      - no-new-privileges:true

  neo4j:
    image: neo4j:5-enterprise  # Enterprise for production
    container_name: neo4j-prod
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_memory_pagecache_size=4G
      - NEO4J_dbms.memory.heap.initial_size=4G
      - NEO4J_dbms_memory_heap_max__size=8G
      - NEO4J_dbms_backup_enabled=true
      - NEO4J_dbms_backup_address=0.0.0.0:6362
    volumes:
      - neo4j_prod_data:/data
      - neo4j_prod_logs:/logs
      - neo4j_prod_backups:/backups
    restart: always
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - prod-network
      - monitoring-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 12G
        reservations:
          cpus: '2'
          memory: 8G
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: redis-prod
    volumes:
      - redis_prod_data:/data
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - prod-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 5G
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-prod
    ports:
      - "9091:9090"
    volumes:
      - ../prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../deploy/config/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_prod_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--web.enable-lifecycle'
    restart: always
    networks:
      - monitoring-network
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-prod
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY=true
      - GF_SNAPSHOTS_EXTERNAL_ENABLED=false
    volumes:
      - grafana_prod_data:/var/lib/grafana
      - ../deploy/config/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    restart: always
    networks:
      - monitoring-network
    security_opt:
      - no-new-privileges:true

  loki:
    image: grafana/loki:latest
    container_name: loki-prod
    ports:
      - "3100:3100"
    volumes:
      - loki_prod_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: always
    networks:
      - monitoring-network
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:alpine
    container_name: nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../deploy/config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../deploy/config/ssl:/etc/nginx/ssl:ro
      - nginx_prod_logs:/var/log/nginx
    depends_on:
      - app
      - api
    restart: always
    networks:
      - prod-network
    security_opt:
      - no-new-privileges:true

volumes:
  prod_data:
  prod_logs:
  prod_api_logs:
  searxng_prod_data:
  neo4j_prod_data:
  neo4j_prod_logs:
  neo4j_prod_backups:
  redis_prod_data:
  prometheus_prod_data:
  grafana_prod_data:
  loki_prod_data:
  nginx_prod_logs:

networks:
  prod-network:
    name: base-agent-prod-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  monitoring-network:
    name: base-agent-monitoring-network
    driver: bridge
