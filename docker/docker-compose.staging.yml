version: '3.8'

# Staging Environment Configuration
# Pre-production validation with production-like topology

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.production
      target: runtime
    image: ${REGISTRY:-ghcr.io}/base-agent:staging
    container_name: base-agent-staging
    ports:
      - "8502:8502"
    environment:
      # ===== ENVIRONMENT =====
      - ENVIRONMENT=staging
      - DEBUG=false
      - LOG_LEVEL=INFO

      # ===== SUPABASE =====
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - DATABASE_URL=${SUPABASE_URL}

      # ===== LLM CONFIGURATION =====
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_CHOICE=${LLM_CHOICE}

      # ===== EMBEDDING CONFIGURATION =====
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_MODEL_CHOICE=${EMBEDDING_MODEL_CHOICE}

      # ===== WEB SEARCH =====
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - SEARXNG_BASE_URL=http://searxng:8080

      # ===== AGENT SETTINGS =====
      - AGENT_NAME=${AGENT_NAME:-Luminari-Staging}
      - AGENT_TEMPERATURE=${AGENT_TEMPERATURE:-0.7}

      # ===== NEO4J CONFIGURATION =====
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}

      # ===== FEATURE FLAGS =====
      - ENABLE_CODE_EXECUTION=${ENABLE_CODE_EXECUTION:-false}
      - ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH:-true}
      - ENABLE_IMAGE_ANALYSIS=${ENABLE_IMAGE_ANALYSIS:-true}
      - ENABLE_LONG_TERM_MEMORY=${ENABLE_LONG_TERM_MEMORY:-true}
      - ENABLE_RAG=${ENABLE_RAG:-true}
      - ENABLE_AGENTIC_RAG=${ENABLE_AGENTIC_RAG:-true}
      - ENABLE_GRAPH_SEARCH=${ENABLE_GRAPH_SEARCH:-true}

      # ===== LOGGING =====
      - LOG_FORMAT=json
      - ENABLE_STRUCTURED_LOGGING=true

      # ===== MONITORING =====
      - ENABLE_METRICS=true
      - METRICS_PORT=8002
      - HEALTH_CHECK_INTERVAL=30

      # ===== PERFORMANCE =====
      - MAX_CONCURRENT_REQUESTS=10
      - REQUEST_TIMEOUT=300
      - RATE_LIMIT_PER_MINUTE=60

    volumes:
      - staging_data:/app/data
      - staging_logs:/app/logs

    depends_on:
      searxng:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      prometheus:
        condition: service_started

    restart: always

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8502/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - staging-network

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.production
      target: api
    image: ${REGISTRY:-ghcr.io}/base-agent-api:staging
    container_name: base-agent-api-staging
    ports:
      - "8058:8058"
    environment:
      - ENVIRONMENT=staging
      - DEBUG=false
      - LOG_LEVEL=INFO
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_API_KEY=${LLM_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - ENABLE_METRICS=true
      - LOG_FORMAT=json
    volumes:
      - staging_api_logs:/app/logs
    depends_on:
      - neo4j
      - prometheus
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8058/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - staging-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  searxng:
    image: searxng/searxng:latest
    container_name: searxng-staging
    ports:
      - "8084:8080"
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_HOSTNAME=searxng
      - SEARXNG_BASE_URL=http://searxng:8080/
    volumes:
      - searxng_staging_data:/etc/searxng
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - staging-network

  neo4j:
    image: neo4j:5-community
    container_name: neo4j-staging
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_dbms.memory.heap.initial_size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_staging_data:/data
      - neo4j_staging_logs:/logs
    restart: always
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - staging-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  redis:
    image: redis:7-alpine
    container_name: redis-staging
    ports:
      - "6381:6379"
    volumes:
      - redis_staging_data:/data
    restart: always
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - staging-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-staging
    ports:
      - "9091:9090"
    volumes:
      - ../prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_staging_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: always
    networks:
      - staging-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-staging
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_staging_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: always
    networks:
      - staging-network

volumes:
  staging_data:
  staging_logs:
  staging_api_logs:
  searxng_staging_data:
  neo4j_staging_data:
  neo4j_staging_logs:
  redis_staging_data:
  prometheus_staging_data:
  grafana_staging_data:

networks:
  staging-network:
    name: base-agent-staging-network
    driver: bridge
