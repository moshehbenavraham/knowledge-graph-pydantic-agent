[tox]
envlist = py311,py312,lint,security,type-check,docs
isolated_build = True
skipsdist = False

[testenv]
deps = 
    pytest>=7.4.0
    pytest-cov>=4.1.0
    pytest-asyncio>=0.21.0
    pytest-timeout>=2.2.0
    pytest-benchmark>=4.0.0
    hypothesis>=6.100.0
commands = 
    pytest {posargs:tests/} -v --cov=src --cov-report=term-missing

[testenv:py311]
basepython = python3.11

[testenv:py312]
basepython = python3.12

[testenv:lint]
deps = 
    black>=24.0.0
    ruff>=0.8.0
    docformatter>=1.7.5
commands = 
    black --check src/ tests/
    ruff check src/ tests/
    docformatter --check -r src/

[testenv:format]
deps = 
    black>=24.0.0
    ruff>=0.8.0
    docformatter>=1.7.5
commands = 
    black src/ tests/
    ruff check --fix src/ tests/
    docformatter -i -r src/

[testenv:security]
deps = 
    bandit>=1.7.5
    safety>=2.3.0
    pip-audit>=2.6.0
commands = 
    bandit -r src/ -ll
    safety check --json
    pip-audit

[testenv:type-check]
deps = 
    mypy>=1.8.0
    types-PyYAML
    types-requests
commands = 
    mypy src/ tests/

[testenv:docs]
deps = 
    sphinx>=7.0.0
    sphinx-rtd-theme>=2.0.0
    sphinx-autodoc-typehints>=1.25.0
commands = 
    sphinx-build -b html docs docs/_build

[testenv:load-test]
deps = 
    locust>=2.20.0
commands = 
    locust -f tests/load/locustfile.py --headless --users 50 --spawn-rate 5 --run-time 2m --host=http://localhost:8058

[testenv:profile]
deps = 
    py-spy>=0.3.14
    memory-profiler>=0.61.0
commands = 
    py-spy record -d 30 -f profile-flamegraph.svg -- python -m src.api.main

[testenv:dev]
deps = 
    {[testenv]deps}
    {[testenv:lint]deps}
    {[testenv:security]deps}
    {[testenv:type-check]deps}
    httpie>=3.2.2
    ipdb>=0.13.13
commands = 
    pytest {posargs:tests/} -v
    black --check src/ tests/
    ruff check src/ tests/
    mypy src/

[testenv:integration]
deps = 
    {[testenv]deps}
    httpie>=3.2.2
setenv = 
    INTEGRATION_TEST = true
commands = 
    pytest tests/integration/ -v --tb=short

[testenv:benchmark]
deps = 
    {[testenv]deps}
    pytest-benchmark>=4.0.0
    locust>=2.20.0
commands = 
    pytest tests/test_performance.py -v --benchmark-only
    locust -f tests/load/locustfile.py --headless --users 50 --spawn-rate 5 --run-time 2m --host=http://localhost:8058 --csv=benchmark