# Ruff configuration file
# https://docs.astral.sh/ruff/configuration/

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 100
indent-width = 4

# Assume Python 3.11+.
target-version = "py311"

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "TID",    # flake8-tidy-imports
    "Q",      # flake8-quotes
    "RET",    # flake8-return
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # pylint
    "PERF",   # perflint
    "RUF",    # ruff-specific rules
]

ignore = [
    "PLR0913",  # Too many arguments to function call
    "PLR0912",  # Too many branches
    "PLR0915",  # Too many statements
    "PLR2004",  # Magic value used in comparison
    "PLR0911",  # Too many return statements
    "RET504",   # Unnecessary variable assignment before return
    "SIM108",   # Use ternary operator instead of if-else-block
    "SIM102",   # Use single if instead of nested if (sometimes clearer as nested)
    "B008",     # Function call in argument defaults (FastAPI Depends pattern)
    "PLC0415",  # Import not at top-level (valid for lazy/conditional imports)
    "PLW0603",  # Global statement (needed for backward compatibility)
    "PLW0602",  # Global variable undefined at module level
    "PLW2901",  # Loop variable overwritten (intentional in some cases)
    "B904",     # Within except, raise with from err/None (not always needed)
    "B027",     # Empty method in abstract class (hook pattern)
    "B017",     # pytest.raises(Exception) in tests is acceptable
    "E402",     # Module import not at top (valid in test fixtures)
    "E722",     # Bare except (valid for catch-all error handling)
    "ERA001",   # Commented code (sometimes needed for documentation)
    "PTH123",   # Use Path.open instead of open (not critical)
    "PERF401",  # Use list comprehension (sometimes less readable)
    "RUF012",   # Mutable class attributes (Locust and other frameworks need this)
    "SIM117",   # Combine with statements (sometimes clearer as nested)
    "SIM105",   # Use contextlib.suppress (not always clearer)
    "N801",     # Class name conventions (test classes can have underscores)
    "N802",     # Function name conventions (test functions can have caps)
    "N806",     # Mock variable naming in tests is acceptable
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[lint.isort]
known-first-party = ["src"]
